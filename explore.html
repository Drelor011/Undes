<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Каталог — Ündes</title>
  <meta name="description" content="Каталог стихотворений Ündes: поиск по автору, языку и тематике." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23823D46'/><text x='16' y='23' font-family='Georgia,serif' font-size='20' fill='white' text-anchor='middle' font-weight='700'>Ü</text></svg>" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-page="explore">
  <div data-navbar></div>
  <main data-page>
    <section class="section section--tight" style="padding-bottom:0;">
      <div class="container">
        <span class="eyebrow">Catalog</span>
        <h1 class="section-title" data-i18n="explore.title">Каталог стихотворений</h1>
        <p class="text-muted" data-i18n="explore.sub">Ищите по теме, автору или настроению</p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="filters">
          <div class="search-input">
            <span class="search-input__icon" data-lucide="search"></span>
            <input type="search" id="searchInput" autocomplete="off" data-i18n-placeholder="explore.searchPlaceholder" placeholder="Поиск по названию или автору…" />
          </div>
          <select class="select" id="langFilter">
            <option value="" data-i18n="explore.allLanguages">Все языки</option>
            <option value="kz">Қазақша</option>
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
          <select class="select" id="catFilter">
            <option value="" data-i18n="explore.allCategories">Все темы</option>
          </select>
          <select class="select" id="sortFilter">
            <option value="popular" data-i18n="explore.sort.popular">По популярности</option>
            <option value="recent" data-i18n="explore.sort.recent">По новизне</option>
            <option value="title" data-i18n="explore.sort.title">По названию</option>
          </select>
        </div>

        <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap;gap:12px;">
          <p class="text-muted" id="resultsCount" style="font-size:14px;"></p>
          <button class="btn btn--ghost btn--sm hidden" id="clearFilters"><span data-lucide="x"></span> <span data-i18n="explore.clear">Сбросить фильтры</span></button>
        </div>

        <div class="grid grid--poems" id="poemsGrid"></div>

        <div class="pagination" id="pagination"></div>
      </div>
    </section>
  </main>
  <div data-footer></div>

  <script src="authors.js"></script>
  <script src="poems.js"></script>
  <script src="categories.js"></script>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="tts.js"></script>
  <script src="ui.js"></script>
  <script src="layout.js"></script>
  <script src="cards.js"></script>
  <script src="quote-card.js"></script>
  <script src="bootstrap.js"></script>
  <script src="explore-page.js"></script>
</body>
</html>
